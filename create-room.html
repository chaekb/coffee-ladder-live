<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커피내기 사다리 - 방 만들기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>방 만들기 ☕</h1>
            <input type="text" id="nickname" placeholder="방장 닉네임을 입력하세요">
            <!-- 
              주의: type="module"을 사용하면 onclick="createRoom()"을 직접 호출할 수 없으므로,
              button에 id="createBtn"을 부여하고 자바스크립트 내에서 이벤트를 연결합니다.
            -->
            <button class="button" id="createBtn">방 생성하기</button>
            <a href="index.html" class="button secondary">뒤로가기</a>
        </div>
    </div>

    <!-- js 파일을 불러올 때 반드시 type="module"을 적어주어야 import 구문이 작동합니다 -->
    <script type="module" src="create-room.js"></script>
</body>
</html>
