<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 커피내기 사다리타기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>? 실시간 커피 사다리</h1>
        
        <!-- 1단계: 방 생성 / 입장 -->
        <div id="lobby-zone" class="card">
            <button id="btn-create-room">새로운 게임방 만들기</button>
            <p id="room-link-container" class="hidden">
                공유 링크: <input type="text" id="room-link" readonly>
                <button id="btn-copy">복사</button>
            </p>
        </div>

        <!-- 2단계: 닉네임 입력 (방 입장 후) -->
        <div id="join-zone" class="card hidden">
            <input type="text" id="user-name" placeholder="닉네임을 입력하세요" maxlength="8">
            <button id="btn-join">참가하기</button>
        </div>

        <!-- 3단계: 대기실 및 사다리 게임판 -->
        <div id="game-zone" class="card hidden">
            <h3 id="room-title"></h3>
            <div id="participant-list">참가자: 대기 중...</div>
            
            <div class="control-box">
                <button id="btn-start-game" class="hidden">사다리 타기 시작!</button>
            </div>

            <!-- 사다리가 그려질 공간 -->
            <div class="canvas-container">
                <canvas id="ladder-canvas" width="600" height="400"></canvas>
            </div>
        </div>
    </div>

    <!-- 결과 이모션 팝업 오버레이 -->
    <div id="result-overlay" class="overlay hidden">
        <div class="result-content">
            <div id="result-emoji" class="emoji-animation">??</div>
            <h2 id="result-message">당첨자 발표</h2>
            <p id="result-sub"></p>
            <button id="btn-close-popup">확인</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
